name: rsfseg
channels:
  - conda-forge
  - defaults

dependencies:
  # Core packages installed via Conda
  - python=3.10
  - numpy
  - scikit-image
  - dipy
  - scipy
  - tqdm
  - pyvista
  - nibabel

  - pip
  
  # Pip-only packages
  - pip:
      - -e .
      - dbdicom
      - miblab
      - pydmr
      - miblab-dl
      - miblab-plot
      - vreg
      - numpyradiomics