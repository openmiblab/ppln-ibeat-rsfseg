name: rsfseg
channels:
  - conda-forge
  - defaults

dependencies:
  # Core packages installed via Conda
  - python=3.10
  - dask
  - numpy
  - pandas
  - scipy
  - scikit-image
  - scikit-learn
  - matplotlib
  - tqdm
  - napari
  - pip
  
  # Pip-only packages
  - pip:
      - -e .
      - dbdicom
      - vreg
      - pydmr
      - pyvista
      - miblab
      - miblab-dl
      - miblab-plot
      - dipy